[project]
name = "timika30k-dataset"
version = "0.1.0"
description = "Reproducibility pipeline for timika-30k: download, labels/pseudo-labels, preprocessing variants, dataset QC"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.2",
    "scikit-image>=0.16",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "torch>=2.2",
    "torchvision>=0.17",
    "torchxrayvision",
    "segment-anything",
    "scikit-learn>=1.4",
    "umap-learn>=0.5.6",
    "matplotlib>=3.8",
    "timika30k-pseudolabels",
    "opencv-python-headless>=4.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]
torchxrayvision = { path = "../../external/torchxrayvision", editable = true }
timika30k-pseudolabels = { path = "../timika30k_pseudolabels", editable = true }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/timika30k_dataset"]
